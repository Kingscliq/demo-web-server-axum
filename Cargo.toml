[package]
name = "blog-post-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {   version = "1.28.0", features = ["full"] }
axum = "0.8.8"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1.44"
uuid = { version = "1.4.0", features = ["v4", "serde"] }
chrono = { version = "0.4.26", features = ["serde"] }
tracing-subscriber = {version = "0.3.22", features = ["fmt", "env-filter"]} 
sqlx = {version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "uuid", "chrono", "json"] }